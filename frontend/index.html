
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ExamForge | Online Examination</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f6fc;
      color: #24243b;
      line-height: 1.6;
    }

    button {
      border: none;
      cursor: pointer;
      font-size: 15px;
      font-weight: bold;
      border-radius: 8px;
      padding: 12px 18px;
      transition: 0.2s;
    }

    button:hover {
      opacity: 0.88;
      transform: translateY(-1px);
    }

    .navbar {
      background: white;
      padding: 18px 7%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #e8eaf2;
    }

    .logo {
      font-size: 26px;
      font-weight: bold;
      color: #635bdb;
    }

    .nav-status {
      color: #16834a;
      font-size: 14px;
      font-weight: bold;
    }

    .hero {
      margin: 35px auto;
      max-width: 1100px;
      padding: 40px;
      border-radius: 18px;
      color: white;
      background: linear-gradient(120deg, #5146d8, #9585f6);
    }

    .hero h1 {
      font-size: 34px;
      margin-bottom: 12px;
    }

    .hero p {
      line-height: 1.8;
      max-width: 650px;
    }

    main {
      max-width: 1100px;
      margin: auto;
      padding: 0 22px 50px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      margin-bottom: 35px;
    }

    .stat, .exam-card {
      background: white;
      padding: 24px;
      border-radius: 14px;
      border: 1px solid #e8eaf2;
      box-shadow: 0 5px 18px rgba(35, 35, 80, 0.04);
    }

    .stat p {
      color: #777f98;
      margin-bottom: 8px;
    }

    .stat h2 {
      font-size: 28px;
    }

    .section-title {
      margin-bottom: 20px;
    }

    .exam-list {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .tag {
      display: inline-block;
      background: #eeedff;
      color: #635bdb;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      margin-bottom: 18px;
      font-weight: bold;
    }

    .exam-card h3 {
      margin-bottom: 12px;
      font-size: 20px;
    }

    .exam-card p {
      color: #737991;
      margin-bottom: 20px;
    }

    .primary-btn {
      background: #635bdb;
      color: white;
    }

    .secondary-btn {
      background: #ecebff;
      color: #5146d8;
    }

    .message {
      margin: 16px 0;
      color: #c0392b;
    }

    .exam-page {
      max-width: 850px;
      margin: 30px auto;
      padding: 20px;
    }

    .exam-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin: 22px 0;
    }

    .timer {
      background: #fff0f0;
      color: #c0392b;
      border-radius: 8px;
      padding: 10px 16px;
      font-weight: bold;
    }

    .question-card {
      background: white;
      border: 1px solid #e5e7f0;
      border-radius: 14px;
      padding: 24px;
      margin: 18px 0;
    }

    .question-card h3 {
      margin-bottom: 15px;
      font-size: 18px;
    }

    .option {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 12px;
      margin: 8px 0;
      background: #f8f8fd;
      border-radius: 8px;
      cursor: pointer;
    }

    .option:hover {
      background: #efeeff;
    }

    .option input {
      margin-top: 5px;
    }

    .result-card {
      background: white;
      padding: 35px 25px;
      border-radius: 16px;
      text-align: center;
      margin-top: 25px;
      border: 1px solid #e5e7f0;
    }

    .score {
      font-size: 38px;
      color: #635bdb;
      font-weight: bold;
      margin: 12px;
    }

    .footer {
      text-align: center;
      padding: 25px;
      color: #85899c;
      font-size: 13px;
    }

    @media (max-width: 750px) {
      .exam-list, .stats {
        grid-template-columns: 1fr;
      }

      .hero {
        margin: 20px 15px;
        padding: 26px;
      }

      .hero h1 {
        font-size: 27px;
      }

      .navbar {
        padding: 16px 20px;
      }

      .logo {
        font-size: 22px;
      }
    }
  </style>
</head>

<body>
  <header class="navbar">
    <div class="logo">ExamForge.</div>
    <div class="nav-status">● Online</div>
  </header>

  <div id="app"></div>

  <footer class="footer">
    ExamForge — Online Examination Platform
  </footer>

  <script>
    const examData = [
      {
        id: 1,
        title: "Java Fundamentals",
        duration: 30,
        questions: [
          {
            question: "Which keyword is used to declare a class in Java?",
            options: ["function", "class", "define", "struct"],
            answer: 1
          },
          {
            question: "Which method is the entry point of a Java program?",
            options: ["start()", "run()", "main()", "init()"],
            answer: 2
          },
          {
            question: "Which data type stores true or false?",
            options: ["int", "String", "boolean", "char"],
            answer: 2
          },
          {
            question: "Which keyword creates an object in Java?",
            options: ["create", "new", "object", "make"],
            answer: 1
          },
          {
            question: "Java is primarily a ______ language.",
            options: ["Markup", "Programming", "Query", "Styling"],
            answer: 1
          }
        ]
      },
      {
        id: 2,
        title: "Web Development Basics",
        duration: 20,
        questions: [
          {
            question: "Which language structures a web page?",
            options: ["HTML", "SQL", "Java", "C"],
            answer: 0
          },
          {
            question: "Which language styles a web page?",
            options: ["Python", "CSS", "C++", "SQL"],
            answer: 1
          },
          {
            question: "Which language adds interactivity to a web page?",
            options: ["HTML only", "CSS only", "JavaScript", "XML"],
            answer: 2
          },
          {
            question: "Which HTML tag creates a hyperlink?",
            options: ["<link>", "<a>", "<href>", "<url>"],
            answer: 1
          },
          {
            question: "Which HTML tag displays an image?",
            options: ["<image>", "<pic>", "<img>", "<src>"],
            answer: 2
          }
        ]
      },
      {
        id: 3,
        title: "Database Management",
        duration: 25,
        questions: [
          {
            question: "What does SQL stand for?",
            options: [
              "Structured Query Language",
              "Simple Question Language",
              "System Quick Logic",
              "Standard Queue List"
            ],
            answer: 0
          },
          {
            question: "Which SQL command retrieves data?",
            options: ["GET", "SELECT", "PUSH", "OPEN"],
            answer: 1
          },
          {
            question: "Which key uniquely identifies a row?",
            options: [
              "Foreign key",
              "Duplicate key",
              "Primary key",
              "Common key"
            ],
            answer: 2
          },
          {
            question: "Which command adds a new row to a table?",
            options: ["INSERT", "REMOVE", "FETCH", "ALTER"],
            answer: 0
          },
          {
            question: "Which command modifies existing records?",
            options: ["CHANGE", "UPDATE", "RENAME", "SELECT"],
            answer: 1
          }
        ]
      }
    ];

    let currentExam = null;
    let timerInterval = null;
    let secondsRemaining = 0;
    let submitted = false;

    function showDashboard() {
      clearInterval(timerInterval);
      currentExam = null;
      submitted = false;

      document.getElementById("app").innerHTML = `
        <section class="hero">
          <h1>Welcome to ExamForge 👋</h1>
          <p>
            Test your knowledge, practice your skills, and track your
            performance with our online examination platform.
          </p>
        </section>

        <main>
          <section class="stats">
            <article class="stat">
              <p>Available Exams</p>
              <h2>${examData.length}</h2>
            </article>
            <article class="stat">
              <p>Questions Available</p>
              <h2>${examData.reduce((sum, exam) =>
                sum + exam.questions.length, 0)}</h2>
            </article>
            <article class="stat">
              <p>Exam Status</p>
              <h2 style="color:#16834a">Ready</h2>
            </article>
          </section>

          <h2 class="section-title">Available Examinations</h2>
          <p id="message" class="message"></p>

          <section class="exam-list">
            ${examData.map(exam => `
              <article class="exam-card">
                <span class="tag">ONLINE EXAM</span>
                <h3>${exam.title}</h3>
                <p>
                  Duration: ${exam.duration} minutes<br>
                  Questions: ${exam.questions.length}
                </p>
                <button class="primary-btn"
                  onclick="selectExam(${exam.id})">
                  Start Exam →
                </button>
              </article>
            `).join("")}
          </section>
        </main>
      `;
    }

    function selectExam(id) {
      const exam = examData.find(item => item.id === id);

      if (!exam) {
        alert("Exam not found!");
        return;
      }

      currentExam = exam;
      submitted = false;
      secondsRemaining = exam.duration * 60;

      renderExam();
      startTimer();
      window.scrollTo(0, 0);
    }

    function renderExam() {
      const exam = currentExam;

      document.getElementById("app").innerHTML = `
        <main class="exam-page">
          <button class="secondary-btn" onclick="confirmBack()">
            ← Back to Dashboard
          </button>

          <div class="exam-top">
            <div>
              <h1>${exam.title}</h1>
              <p>${exam.questions.length} questions ·
                ${exam.duration} minutes</p>
            </div>
            <div class="timer" id="timer">
              Time: ${formatTime(secondsRemaining)}
            </div>
          </div>

          <div id="examContent">
            <form id="examForm">
              ${exam.questions.map((q, i) => `
                <section class="question-card">
                  <h3>${i + 1}. ${q.question}</h3>
                  ${q.options.map((option, j) => `
                    <label class="option">
                      <input type="radio" name="q${i}"
                        value="${j}">
                      <span>${escapeHTML(option)}</span>
                    </label>
                  `).join("")}
                </section>
              `).join("")}

              <button type="submit" class="primary-btn">
                Submit Exam
              </button>
            </form>
          </div>
        </main>
      `;

      document.getElementById("examForm").addEventListener(
        "submit",
        function(event) {
          event.preventDefault();
          submitExam();
        }
      );
    }

    function startTimer() {
      clearInterval(timerInterval);

      timerInterval = setInterval(() => {
        if (submitted) {
          clearInterval(timerInterval);
          return;
        }

        secondsRemaining--;

        const timer = document.getElementById("timer");

        if (timer) {
          timer.textContent = "Time: " + formatTime(
            Math.max(0, secondsRemaining)
          );
        }

        if (secondsRemaining <= 0) {
          submitExam();
        }
      }, 1000);
    }

    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = seconds % 60;

      return String(mins).padStart(2, "0") + ":" +
        String(secs).padStart(2, "0");
    }

    function submitExam() {
      if (submitted || !currentExam) return;

      submitted = true;
      clearInterval(timerInterval);

      let score = 0;
      let answered = 0;

      currentExam.questions.forEach((question, i) => {
        const selected = document.querySelector(
          `input[name="q${i}"]:checked`
        );

        if (selected) {
          answered++;

          if (Number(selected.value) === question.answer) {
            score++;
          }
        }
      });

      const total = currentExam.questions.length;
      const percentage = Math.round((score / total) * 100);

      document.getElementById("examContent").innerHTML = `
        <section class="result-card">
          <h2>Exam Submitted Successfully! 🎉</h2>
          <p class="score">${score} / ${total}</p>
          <h3>${percentage}% Score</h3>
          <p style="margin:12px 0">
            Correct answers: ${score}<br>
            Incorrect or unanswered: ${total - score}<br>
            Questions answered: ${answered} / ${total}
          </p>
          <p style="margin:12px 0">
            ${percentage >= 80
              ? "Excellent work! Keep it up."
              : percentage >= 50
                ? "Good effort! Keep practising."
                : "Keep learning and try again."}
          </p>
          <button class="primary-btn" onclick="showDashboard()">
            Back to Dashboard
          </button>
          <button class="secondary-btn"
            onclick="selectExam(${currentExam.id})">
            Try Again
          </button>
        </section>
      `;

      window.scrollTo(0, 0);
    }

    function confirmBack() {
      if (submitted || confirm("Leave this exam? Your current answers will be lost.")) {
        showDashboard();
      }
    }

    function escapeHTML(value) {
      return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[char]);
    }

    showDashboard();
  </script>
</body>
</html>
